<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification Gateway - RewardsHub</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --bg-dark: #0f172a;
            --form-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --banner-gradient: linear-gradient(90deg, #ff007f, #7928ca, #ff007f);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Animations --- */
        @keyframes bannerScroll {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes pulseDot {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes float3D {
            0% { transform: translateY(0px) rotateX(0deg); }
            50% { transform: translateY(-8px) rotateX(2deg); }
            100% { transform: translateY(0px) rotateX(0deg); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmerBtn {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* --- Top Banner --- */
        .top-banner {
            width: 100%;
            background: var(--banner-gradient);
            background-size: 200% auto;
            animation: bannerScroll 3s linear infinite;
            text-align: center;
            padding: 12px 10px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* --- Header Section --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 25px 20px;
            animation: slideUpFade 0.8s ease-out;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 900;
        }

        .logo span {
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 10px rgba(255,255,255,0.1);
        }

        .traffic-indicator {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: pulseDot 2s infinite;
        }

        .traffic-count {
            color: var(--accent);
            font-weight: bold;
        }

        /* --- 3D Form Container --- */
        .form-container {
            background: var(--form-bg);
            width: 92%;
            max-width: 500px;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.15);
            animation: slideUpFade 1s ease-out, float3D 6s ease-in-out infinite;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Ambient Glow Behind Form */
        .form-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .form-header h1 {
            font-size: 1.7rem;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* --- Inputs & Labels --- */
        .input-group {
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Smooth Neon Focus Glow */
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
            background: rgba(15, 23, 42, 0.95);
            transform: translateY(-2px);
        }

        .input-group input::placeholder {
            color: #475569;
        }

        /* --- Animated Submit Button --- */
        .submit-btn {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(139, 92, 246, 0.5);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg);
            animation: shimmerBtn 2.5s infinite;
        }
    </style>
</head>
<body>

    <div class="top-banner">
        🔥 Hurry! Only 14 seats remain for today's allocation pool!
    </div>

    <header>
        <div class="logo">
            🎁 <span>RewardsHub</span>
        </div>
        <div class="traffic-indicator">
            <div class="dot"></div>
            Traffic: <span class="traffic-count">392</span> active
        </div>
    </header>

    <main class="form-container">
        <div class="form-header">
            <h1>Secure Verification Gateway</h1>
            <p>Provide accurate parameters below to bypass bot filters instantly</p>
        </div>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" placeholder="John" required>
            </div>
            
            <div class="input-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" placeholder="Doe" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label for="zip">Zip Code / Postcode</label>
                <input type="text" id="zip" name="zip" placeholder="10001" required>
            </div>
            
            <div class="input-group">
                <label for="address">Full Delivery Address</label>
                <input type="text" id="address" name="address" placeholder="123 Main St" required>
            </div>

            <button type="submit" class="submit-btn">Verify & Continue ➔</button>
        </form>
    </main>

</body>
</html>
